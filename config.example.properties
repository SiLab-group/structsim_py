# Example configuration for `structsim`.
# Copy to `config.properties`, adjust the paths, then run:  structsim -c config.properties
#
# pathParameters               : input parameter file (key=value lines, e.g. val1=1.0)
# pathOUT                      : directory where the framework writes its own results
# pathSimulator                : directory representing the external simulator's workspace
# pathToSimulatorResultFile    : file the simulator writes its raw result to
# cuttOfPlanning               : the cut-off value (interpreted per typeCuttOfPlanning)
# typeCuttOfPlanning           : INT | CRITERIA | DAY | HOURS | MINUTES
#   INT       -> explore a fixed number of planning steps (cuttOfPlanning = integer)
#   CRITERIA  -> explore while probability > cuttOfPlanning (cuttOfPlanning = float)
#   DAY/HOURS/MINUTES -> explore for a wall-clock duration (cuttOfPlanning = integer)

pathParameters = resources/parameters.txt
pathOUT = /tmp/structsim-results
pathSimulator = /tmp/structsim-simulator
pathToSimulatorResultFile = /tmp/structsim-simulator/results/results.txt
cuttOfPlanning = 3
typeCuttOfPlanning = INT
