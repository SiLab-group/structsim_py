[project]
name = "structsim"
version = "0.1.0"
description = "Python migration of the SiLab group's Java structSim structured-simulation framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
authors = [
    { name = "Matthias Gaillard" },
]
keywords = ["simulation", "structured-simulation", "silab", "structsim"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
# Runtime uses only the Python standard library: abc, argparse, configparser,
# datetime, logging, os, queue, shutil, threading, traceback, typing.
dependencies = []

[project.urls]
"Source (this migration)" = "https://github.com/Matthjass13/structSim_py"
"Original Java framework" = "https://github.com/SiLab-group/structSim"

[project.scripts]
structsim = "structsim.__main__:main"

[dependency-groups]
# Installed by `uv sync` (dev is included by default).
dev = [
    "pytest>=8",
    "pylint>=3",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"

[tool.pylint.format]
max-line-length = 120
